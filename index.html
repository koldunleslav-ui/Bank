<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Bank - Депозити UA</title>
    <!-- Підключаємо TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #wallet-info {
            margin-top: 15px;
            font-size: 15px;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            min-height: 50px;
        }
        .bank-section {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #334155;
            padding-top: 15px;
            text-align: left;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }
        button.action-btn:hover {
            background: #0ea5e9;
        }
        .info-text {
            font-size: 13px;
            color: #4ade80;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>TON Bank</h1>
        <p>Підключіть ваш TON гаманець для роботи з депозитами</p>
        
        <!-- Кнопка підключення гаманця -->
        <div id="ton-connect-button"></div>

        <!-- Блок для відображення нікнейму/адреси -->
        <div id="wallet-info">
            <span>Вітаю, <strong id="user-nickname">Користувач</strong>!</span><br>
            <span style="font-size: 12px; color: #64748b;" id="wallet-address"></span>
        </div>

        <!-- Форма депозиту (з'явиться після підключення гаманця) -->
        <div id="bank-interface" class="bank-section">
            <div class="input-group">
                <label for="deposit-amount">Сума депозиту (UA):</label>
                <input type="number" id="deposit-amount" placeholder="Введіть кількість UA">
            </div>

            <div class="input-group">
                <label for="deposit-term">Термін:</label>
                <select id="deposit-term">
                    <option value="30">30 днів (10% річних)</option>
                    <option value="90">90 днів (15% річних)</option>
                    <option value="365">1 рік (25% річних)</option>
                </select>
            </div>

            <button class="action-btn" onclick="createDeposit()">Покласти під відсотки</button>
            <div id="status-msg" class="info-text"></div>
        </div>
    </div>

    <script>
        // Ініціалізація TON Connect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/koldunleslav-ui/Bank/main/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // Відстеження зміни статусу підключення гаманця
        tonConnectUI.onStatusChange(walletInfo => {
            const infoBox = document.getElementById('wallet-info');
            const addressSpan = document.getElementById('wallet-address');
            const nicknameSpan = document.getElementById('user-nickname');
            const bankInterface = document.getElementById('bank-interface');

            if (walletInfo) {
                // Гаманець підключено -> показуємо блоки
                infoBox.style.display = 'block';
                bankInterface.style.display = 'block';
                
                const rawAddress = walletInfo.account.address;
                const shortAddress = rawAddress.slice(0, 4) + '...' + rawAddress.slice(-4);
                addressSpan.innerText = shortAddress;

                const userName = walletInfo.name || shortAddress;
                nicknameSpan.innerText = userName;
            } else {
                // Гаманець відключено -> ховаємо
                infoBox.style.display = 'none';
                bankInterface.style.display = 'none';
            }
        });

        function createDeposit() {
            const amount = document.getElementById('deposit-amount').value;
            const term = document.getElementById('deposit-term').value;
            const statusMsg = document.getElementById('status-msg');

            if (!amount || amount <= 0) {
                statusMsg.style.color = '#f87171';
                statusMsg.innerText = 'Введіть коректну суму!';
                return;
            }

            statusMsg.style.color = '#4ade80';
            statusMsg.innerText = `Успішно! Запит на депозит ${amount} UA прийнято.`;
        }
    </script>
</body>
</html>
