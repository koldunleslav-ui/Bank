<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Bank - Депозити UA</title>
    <!-- Підключаємо TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <!-- Підключаємо Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #wallet-info {
            margin-top: 20px;
            font-size: 16px;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        /* Контейнер для офіційної кнопки TON Connect */
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .bank-section {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #334155;
            padding-top: 15px;
            text-align: left;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }
        button.action-btn:hover {
            background: #0ea5e9;
        }
        .info-text {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>TON Bank</h1>
        <p>Підключіть ваш TON гаманець для роботи з депозитами</p>
        
        <!-- Кнопка підключення гаманця від TON Connect -->
        <div id="ton-connect-button"></div>

        <!-- Блок для відображення нікнейму/адреси -->
        <div id="wallet-info">
            <span>Вітаю, <strong id="user-nickname">Користувач</strong>!</span><br>
            <span style="font-size: 12px; color: #64748b;" id="wallet-address"></span>
        </div>

        <!-- Секція депозитів (з'являється після підключення) -->
        <div id="bank-interface" class="bank-section">
            <div class="input-group">
                <label for="deposit-amount">Сума депозиту (UA):</label>
                <input type="number" id="deposit-amount" placeholder="Введіть кількість UA">
            </div>

            <div class="input-group">
                <label for="deposit-term">Термін:</label>
                <select id="deposit-term">
                    <option value="30">30 днів (10% річних)</option>
                    <option value="90">90 днів (15% річних)</option>
                    <option value="365">1 рік (25% річних)</option>
                </select>
            </div>

            <button class="action-btn" onclick="createDeposit()">Покласти під відсотки</button>
            <div id="status-msg" class="info-text"></div>
        </div>
    </div>

    <script>
        // Ініціалізація Supabase (безпечне підключення)
        const SUPABASE_URL = 'https://zitfhobybklgmjpdcbvb.supabase.co';
        const SUPABASE_ANON_KEY = 'ТУТ_БУДЕ_ВАШ_ANON_KEY'; // Можете вставити ключ з панелі Supabase
        let supabase = null;

        try {
            if (SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'ТУТ_БУДЕ_ВАШ_ANON_KEY') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.log("Supabase init error:", e);
        }

        // Ініціалізація TON Connect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/koldunleslav-ui/Bank/main/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        let currentUserAddress = null;

        // Відстеження зміни статусу підключення гаманця
        tonConnectUI.onStatusChange(async walletInfo => {
            const infoBox = document.getElementById('wallet-info');
            const addressSpan = document.getElementById('wallet-address');
            const nicknameSpan = document.getElementById('user-nickname');
            const bankInterface = document.getElementById('bank-interface');

            if (walletInfo) {
                // Гаманець підключено
                infoBox.style.display = 'block';
                bankInterface.style.display = 'block';
                
                currentUserAddress = walletInfo.account.address;
                const shortAddress = currentUserAddress.slice(0, 4) + '...' + currentUserAddress.slice(-4);
                addressSpan.innerText = shortAddress;

                const userName = walletInfo.name || 'Клієнт';
                nicknameSpan.innerText = userName;

                // Якщо Supabase підключено, реєструємо/перевіряємо користувача в базі
                if (supabase) {
                    await registerUserInSupabase(currentUserAddress);
                }
            } else {
                // Гаманець відключено
                infoBox.style.display = 'none';
                bankInterface.style.display = 'none';
                currentUserAddress = null;
            }
        });

        async function registerUserInSupabase(address) {
            try {
                let { data } = await supabase
                    .from('users')
                    .select('*')
                    .eq('wallet_address', address)
                    .single();

                if (!data) {
                    await supabase.from('users').insert([{ wallet_address: address }]);
                }
            } catch (err) {
                console.log('Помилка реєстрації в базі:', err);
            }
        }

        async function createDeposit() {
            const amount = document.getElementById('deposit-amount').value;
            const term = document.getElementById('deposit-term').value;
            const statusMsg = document.getElementById('status-msg');

            if (!amount || amount <= 0) {
                statusMsg.style.color = '#f87171';
                statusMsg.innerText = 'Введіть коректну суму!';
                return;
            }

            if (!currentUserAddress) {
                statusMsg.style.color = '#f87171';
                statusMsg.innerText = 'Гаманець не підключено!';
                return;
            }

            statusMsg.style.color = '#38bdf8';
            statusMsg.innerText = 'Створення депозиту...';

            if (supabase) {
                try {
                    const { error } = await supabase
                        .from('deposits')
                        .insert([
                            { 
                                user_wallet: currentUserAddress, 
                                amount: parseFloat(amount), 
                                term_days: parseInt(term),
                                status: 'active' 
                            }
                        ]);

                    if (error) throw error;
                    statusMsg.style.color = '#4ade80';
                    statusMsg.innerText = `Депозит на ${amount} UA успішно оформлено!`;
                } catch (err) {
                    statusMsg.style.color = '#f87171';
                    statusMsg.innerText = 'Помилка бази: ' + err.message;
                }
            } else {
                statusMsg.style.color = '#4ade80';
                statusMsg.innerText = `Депозит на ${amount} UA зафіксовано! (Підключіть ключ Supabase для збереження)`;
            }
        }
    </script>
</body>
</html>
