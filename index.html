<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Bank - Депозити UA</title>
    <!-- Підключаємо TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            margin-top: 20px;
        }
        .bank-icon {
            margin-bottom: 10px;
        }
        .bank-icon svg {
            width: 50px;
            height: 50px;
            fill: #38bdf8;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #wallet-info {
            margin-top: 15px;
            font-size: 15px;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            min-height: 50px;
        }
        .bank-section {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #334155;
            padding-top: 15px;
            text-align: left;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }
        button.action-btn:hover {
            background: #0ea5e9;
        }
        .pay-btn {
            background: #10b981;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
        }
        .pay-btn:hover {
            background: #059669;
        }
        .check-btn {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            font-size: 12px;
        }
        .check-btn:hover {
            background: #2563eb;
        }
        .withdraw-btn {
            background: #f59e0b;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
        }
        .withdraw-btn:hover {
            background: #d97706;
        }
        .withdraw-btn:disabled, .withdraw-btn.disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .info-text {
            font-size: 13px;
            color: #4ade80;
            margin-top: 10px;
            text-align: center;
        }
        .deposits-list {
            margin-top: 20px;
            border-top: 1px solid #334155;
            padding-top: 15px;
            text-align: left;
            display: none;
        }
        .deposit-item {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            border-left: 4px solid #38bdf8;
        }
        .deposit-item.paid {
            border-left-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="bank-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 1L3 5v2h18V5l-9-4zM4 10h3v7H4v-7zm5 0h2v7H9v-7zm4 0h2v7h-2v-7zm5 0h3v7h-3v-7zM2 19h20v2H2v-2z"/>
            </svg>
        </div>

        <h1>TON Bank</h1>
        <p>Підключіть ваш TON гаманець для оформлення депозиту UA</p>
        
        <div id="ton-connect-button"></div>

        <div id="wallet-info">
            <span>Вітаю, <strong id="user-nickname">Користувач</strong>!</span><br>
            <span style="font-size: 12px; color: #64748b;" id="wallet-address"></span>
        </div>

        <div id="bank-interface" class="bank-section">
            <div class="input-group">
                <label for="deposit-amount">Сума депозиту (UA):</label>
                <input type="number" id="deposit-amount" placeholder="Введіть кількість UA">
            </div>

            <div class="input-group">
                <label for="deposit-term">Термін:</label>
                <select id="deposit-term">
                    <option value="30" data-rate="10">30 днів (10% річних)</option>
                    <option value="90" data-rate="15">90 днів (15% річних)</option>
                    <option value="365" data-rate="25">1 рік (25% річних)</option>
                </select>
            </div>

            <button class="action-btn" onclick="createDeposit()">Покласти під відсотки</button>
            <div id="status-msg" class="info-text"></div>
        </div>

        <div id="deposits-section" class="deposits-list">
            <strong style="font-size: 14px; color: #38bdf8;">Ваші активні депозити:</strong>
            <div id="deposits-container" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        const BANK_WALLET = "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw";
        const UA_JETTON_MASTER = "EQBrD-UZ8w2tAyxCNjO8lF4ioTwI-ELiQgF7kclC7gM2UOO_";
        const FEEDBACK_BOT = "tokenpist_bot";

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/koldunleslav-ui/Bank/main/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        let currentWalletAddress = '';
        let currentUserNickname = '';

        tonConnectUI.onStatusChange(walletInfo => {
            const infoBox = document.getElementById('wallet-info');
            const addressSpan = document.getElementById('wallet-address');
            const nicknameSpan = document.getElementById('user-nickname');
            const bankInterface = document.getElementById('bank-interface');
            const depositsSection = document.getElementById('deposits-section');

            if (walletInfo) {
                infoBox.style.display = 'block';
                bankInterface.style.display = 'block';
                depositsSection.style.display = 'block';
                
                currentWalletAddress = walletInfo.account.address;
                currentUserNickname = walletInfo.name || 'Користувач';
                
                const shortAddress = currentWalletAddress.slice(0, 4) + '...' + currentWalletAddress.slice(-4);
                addressSpan.innerText = shortAddress;
                nicknameSpan.innerText = currentUserNickname;

                loadUserDeposits();
            } else {
                infoBox.style.display = 'none';
                bankInterface.style.display = 'none';
                depositsSection.style.display = 'none';
                currentWalletAddress = '';
            }
        });

        function createDeposit() {
            const amountInput = document.getElementById('deposit-amount');
            const termSelect = document.getElementById('deposit-term');
            const statusMsg = document.getElementById('status-msg');

            const amount = parseFloat(amountInput.value);
            const term = parseInt(termSelect.value);
            const selectedOption = termSelect.options[termSelect.selectedIndex];
            const rate = parseFloat(selectedOption.getAttribute('data-rate'));

            if (!amount || amount <= 0) {
                statusMsg.style.color = '#f87171';
                statusMsg.innerText = 'Введіть коректну суму!';
                return;
            }

            // Розраховуємо дату завершення (додаємо дні до поточного часу)
            const now = Date.now();
            const finishTime = now + (term * 24 * 60 * 60 * 1000);

            const storageKey = 'ton_bank_deposits_' + currentWalletAddress;
            let deposits = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            deposits.push({
                id: now,
                amount: amount,
                term: term,
                rate: rate,
                date: new Date().toLocaleDateString(),
                finishTime: finishTime,
                paid: false,
                withdrawn: false
            });

            localStorage.setItem(storageKey, JSON.stringify(deposits));

            statusMsg.style.color = '#4ade80';
            statusMsg.innerText = `Успішно! Депозит на ${amount} UA створено.`;
            amountInput.value = '';

            loadUserDeposits();
        }

        function loadUserDeposits() {
            if (!currentWalletAddress) return;
            
            const storageKey = 'ton_bank_deposits_' + currentWalletAddress;
            let deposits = JSON.parse(localStorage.getItem(storageKey) || '[]').filter(d => !d.withdrawn);
            
            const container = document.getElementById('deposits-container');
            
            if (deposits.length === 0) {
                container.innerHTML = '<span style="color: #64748b; font-size: 12px;">У вас поки немає активних депозитів.</span>';
                return;
            }

            const now = Date.now();
            container.innerHTML = '';
            
            deposits.forEach((dep, index) => {
                const commentText = `Депозит #${dep.id}: ${dep.amount} UA`;
                const commentEncoded = encodeURIComponent(commentText);
                const tonTransferUrl = `https://app.tonkeeper.com/transfer/${BANK_WALLET}?jetton=${UA_JETTON_MASTER}&text=${commentEncoded}`;

                // Розрахунок відсотків: (Сума * ставка * дні) / (365 * 100)
                const termDays = dep.term;
                const interest = (dep.amount * dep.rate * termDays) / (365 * 100);
                const totalReturn = (dep.amount + interest).toFixed(2);

                // Перевірка, чи минув термін депозиту
                const isReadyToWithdraw = dep.paid && (now >= dep.finishTime);
                const timeLeftDays = Math.ceil((dep.finishTime - now) / (1000 * 60 * 60 * 24));

                let statusHtml = '';
                if (dep.paid) {
                    if (isReadyToWithdraw) {
                        const withdrawText = `🔔 ВИВІД ДЕПОЗИТУ\nПроєкт: TON Bank (UA Token)\nНік: ${currentUserNickname}\nСума до виводу: ${totalReturn} UA (Тіло: ${dep.amount} + Нараховані %: ${interest.toFixed(2)})\nГаманець: ${currentWalletAddress}\nID депозиту: #${dep.id}`;
                        const withdrawUrl = `https://t.me/share/url?url=${encodeURIComponent(withdrawText)}&to=${FEEDBACK_BOT}`;
                        
                        statusHtml = `
                            <div style="color: #10b981; font-weight: bold; margin-top: 5px;">✅ Оплачено та готово до виводу!</div>
                            <a href="${withdrawUrl}" target="_blank" class="withdraw-btn" onclick="markWithdrawn(${dep.id})">💰 Вивести кошти (у бот)</a>
                        `;
                    } else {
                        statusHtml = `
                            <div style="color: #10b981; font-weight: bold; margin-top: 5px;">✅ Оплачено (Працює)</div>
                            <div style="color: #94a3b8; font-size: 11px; margin-top: 3px;">До виводу залишилось днів: ${timeLeftDays > 0 ? timeLeftDays : 1}</div>
                            <button class="withdraw-btn disabled" disabled>💰 Вивести (доступно після закінчення)</button>
                        `;
                    }
                } else {
                    statusHtml = `
                        <a href="${tonTransferUrl}" target="_blank" class="pay-btn">💳 Переказати UA на скарбницю</a>
                        <button class="check-btn" onclick="checkPayment(${dep.id}, '${commentText}')">🔄 Перевірити оплату</button>
                    `;
                }

                container.innerHTML += `
                    <div class="deposit-item ${dep.paid ? 'paid' : ''}">
                        <strong>#${index + 1} — ${dep.amount} UA</strong><br>
                        Термін: ${dep.term} днів (${dep.rate}% річних) | До виводу: <b>${totalReturn} UA</b><br>
                        <span style="color: #94a3b8; font-size: 11px;">Дата: ${dep.date} | Коментар: ${commentText}</span><br>
                        ${statusHtml}
                    </div>
                `;
            });
        }

        function markWithdrawn(depositId) {
            const storageKey = 'ton_bank_deposits_' + currentWalletAddress;
            let deposits = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            deposits = deposits.map(d => {
                if (d.id === depositId) d.withdrawn = true;
                return d;
            });
            localStorage.setItem(storageKey, JSON.stringify(deposits));
            
            setTimeout(() => {
                alert('Запит на вивод сформовано! Депозит закрито та обнулено.');
                loadUserDeposits();
            }, 1000);
        }

        async function checkPayment(depositId, commentText) {
            const storageKey = 'ton_bank_deposits_' + currentWalletAddress;
            let deposits = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            const btn = event.target;
            const oldText = btn.innerText;
            btn.innerText = 'Перевірка...';
            btn.disabled = true;

            try {
                const response = await fetch(`https://toncenter.com/api/v2/getTransactions?address=${BANK_WALLET}&limit=40&archival=true`);
                const data = await response.json();

                if (data.ok && data.result) {
                    let found = false;
                    for (let tx of data.result) {
                        if (tx.in_msg && tx.in_msg.message) {
                            if (tx.in_msg.message.toLowerCase().includes(commentText.toLowerCase())) {
                                found = true;
                                break;
                            }
                        }
                    }

                    if (found) {
                        deposits = deposits.map(d => {
                            if (d.id === depositId) d.paid = true;
                            return d;
                        });
                        localStorage.setItem(storageKey, JSON.stringify(deposits));
                        alert('Оплату успішно знайдено в блокчейні! Депозит активовано.');
                        loadUserDeposits();
                    } else {
                        alert('Транзакцію поки не знайдено в останніх 40 переказах. Спробуйте ще раз через хвилинку.');
                        btn.innerText = oldText;
                        btn.disabled = false;
                    }
                } else {
                    alert('Помилка зв’язку з блокчейном. Спробуйте ще раз.');
                    btn.innerText = oldText;
                    btn.disabled = false;
                }
            } catch (e) {
                console.error(e);
                alert('Не вдалося перевірити транзакцію. Спробуйте пізніше.');
                btn.innerText = oldText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
